name: Homepage responsive smoke

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/home-flat.css'
      - 'components/FormulaScrollStory*'
      - 'components/HomeStoryRefinement*'
      - 'components/StableHomeJourney*'
      - 'components/LongVideoFormat*'
      - 'components/IdeaMessagesStory*'
      - 'components/IdeaSourcePreview*'
      - 'components/ScrollDiscovery*'
      - 'components/LeadMagnetScene*'
      - 'components/LeadMagnetComparison*'
      - 'public/demo/leadmagnet-*'
      - 'components/SecretFormatsGate*'
      - 'components/sections/HomeMasterclassGate*'
      - 'components/sections/FormulaCompareSection*'
      - 'components/sections/FormulaCompareClear*'
      - 'scripts/check-homepage-story.mjs'
      - 'scripts/check-leadmagnet-demo.mjs'
      - 'scripts/check-content-comparison.mjs'
      - 'hooks/usePrefersReducedMotion.ts'
      - '.github/workflows/homepage-smoke.yml'

permissions:
  contents: read

concurrency:
  group: homepage-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_PREVIEW: '0'
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test dependencies
        timeout-minutes: 4
        run: |
          # Avoid the slow Azure mirror; retain Ubuntu's official archive/security fallbacks.
          # https://github.com/actions/runner-images/issues/14823
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "25";\nAcquire::https::Timeout "25";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-empire-ci-timeouts >/dev/null
          npm install --prefix "$RUNNER_TEMP/empire-browser" --no-package-lock playwright@1.56.1
          ln -s "$RUNNER_TEMP/empire-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/empire-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          if ! command -v google-chrome >/dev/null 2>&1; then
            "$RUNNER_TEMP/empire-browser/node_modules/.bin/playwright" install chrome
          fi
      - run: node scripts/check-leadmagnet-demo.mjs
      - run: node scripts/check-homepage-story.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-responsive-checks
          path: artifacts/homepage/
          retention-days: 7
