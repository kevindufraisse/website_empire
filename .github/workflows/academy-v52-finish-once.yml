name: Academy v52 guarded publication
on:
  push:
    branches: [codex/academy-story-proof-v52-final]
    paths: ['.github/workflows/academy-v52-finish-once.yml']
permissions:
  contents: write
jobs:
  apply-tested-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested Academy version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/academy-story-proof-v52-final'
          packed = ''''''
          payload = json.loads(gzip.decompress(base64.b64decode(packed)))
          allowed = {'public/academy/histoire/' + n for n in ('index.html','animated-v50.js','narrative-v49.js','story-v52.css','story-v52.js')}
          assert set(payload['before']) == allowed == set(payload['after'])
          assert set(payload['new_files']) == {'public/academy/histoire/story-v52.css','public/academy/histoire/story-v52.js'}
          for name, expected in payload['before'].items():
              p = Path(name)
              if expected is None:
                  assert not p.exists(), name
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == expected, name
          exec(compile(payload['builder'], 'academy-v52-tested-builder', 'exec'), {})
          for name, content in payload['new_files'].items():
              Path(name).write_text(content, encoding='utf-8')
          for name, expected in payload['after'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          for name in ['public/press/little-big-things.png','public/press/le-declic.png','public/case-studies/olivier-sarezinski.jpg','public/case-studies/emmanuelle-jazz.jpg','public/case-studies/gaidig-d.jpg','public/case-studies/sophie-guibaud.jpg','public/academy/histoire/assets/cast-story-v33.webp','public/academy/histoire/assets/cast-3d-v32.webp']:
              assert Path(name).is_file(), name
          print('Five files match the locally tested version; required original images exist.')
          PY
          node --check public/academy/histoire/animated-v50.js
          node --check public/academy/histoire/narrative-v49.js
          node --check public/academy/histoire/story-v52.js
          git diff --check
          git add public/academy/histoire/index.html public/academy/histoire/animated-v50.js public/academy/histoire/narrative-v49.js public/academy/histoire/story-v52.css public/academy/histoire/story-v52.js
          git rm .github/workflows/academy-v52-finish-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(academy): restore story turns, verified articles and real testimonials'
          git push origin HEAD:refs/heads/codex/academy-story-proof-v52-final
