name: Apply reviewed unified homepage refinements
on:
  push:
    branches: [codex/comparison-scroll-matrix-20261105]
    paths: [scripts/apply-unified-home-refinement.py, scripts/finalize-unified-home.py, .github/workflows/apply-unified-home-refinement.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/comparison-scroll-matrix-20261105
      - run: python3 scripts/apply-unified-home-refinement.py
      - run: python3 scripts/finalize-unified-home.py
      - run: git diff --check
      - name: Save only the reviewed source and test integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/FormulaScrollStory.tsx components/ContentExpansionScenes.tsx components/PlatformMetrics.tsx components/UnifiedFormatJourney.tsx components/UnifiedFormatJourney.module.css components/LeadMagnetComparison.tsx scripts/check-leadmagnet-demo.mjs scripts/check-homepage-story.mjs
          git commit -m 'Raccorder la scène unique, le compteur cumulatif et les tests de parcours'
          git push origin HEAD:codex/comparison-scroll-matrix-20261105
