name: Academy v51 one-time copy patch
# Temporary, branch-scoped migration. Verifies exact inputs/outputs and deletes itself.
on:
  push:
    branches: [codex/academy-first-client-story-v51]
    paths: ['.github/workflows/academy-copy-v51-once.yml']
permissions:
  contents: write
jobs:
  apply-tested-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-first-client-story-v51
      - name: Apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          checks = {
            'public/academy/histoire/index.html': ('f67d98fafcd313a1309302c0e52b1ae0f366d93dd7f60cebf60f0e1f53105675', '24ded99b5d97c902b5904b5ee5a35d935107be6f10dcd5ed525047ebd00161c0'),
            'public/academy/histoire/narrative-v49.js': ('e94fb988a1765f423741d088a86f1bfc08b93334024929ccc77299f9d6228bff', 'b7bd57518d5067f91c2725311f9746579a473543b2715faba2e24acfa94090e5'),
            'public/academy/histoire/animated-v50.js': ('9526d4e8d46afd20694f86b93b6038bfb7fdc8a06d950c2cccea5b83837cc3a5', '959035d56611b04a0460be46d8ff8e5fd52ee090ffb43abbb32b7b5fd78fcc76')
          }
          for path, (before, after) in checks.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == before, 'Source changed: '+path
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '82a9e34e32c0c89c4e936cf510d0c99176e4a40abf0f279ad8dec2dd7bfebfe5'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          for path, (before, after) in checks.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == after, 'Output mismatch: '+path
          workflow = '.github/workflows/academy-copy-v51-once.yml'
          pathlib.Path(workflow).unlink()
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == set(checks) | {workflow}, changed
          PY
          node --check public/academy/histoire/animated-v50.js
          node --check public/academy/histoire/narrative-v49.js
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add -- public/academy/histoire/index.html public/academy/histoire/narrative-v49.js public/academy/histoire/animated-v50.js .github/workflows/academy-copy-v51-once.yml
          git commit -m 'fix(academy): explain first client, 3000 EUR offer and 24-hour value; remove one-time workflow'
          git push origin HEAD:codex/academy-first-client-story-v51
