name: Inspect supplied lead magnet media
on:
  push:
    branches: [codex/leadmagnet-real-example-20261104]
    paths:
      - scripts/prepare-leadmagnet-pair.py
      - .github/workflows/inspect-leadmagnet-media.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: leadmagnet-media-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/leadmagnet-real-example-20261104
      - uses: actions/download-artifact@v4
        with:
          name: supplied-leadmagnet-media
          run-id: 41926039256
          github-token: ${{ github.token }}
          path: artifacts/leadmagnet-media/
      - name: Install media tools with bounded network timeouts
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null; then
            printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "0";\n' | sudo tee /etc/apt/apt.conf.d/99-empire-media-timeouts >/dev/null
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - run: python3 scripts/prepare-leadmagnet-pair.py
      - name: Save only the reviewed comparison assets on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/demo/leadmagnet-source-20261104.mp4 public/demo/leadmagnet-source-20261104.jpg public/demo/leadmagnet-result-20261104.mp4 public/demo/leadmagnet-result-20261104.jpg public/demo/leadmagnet-pair-20261104.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ajouter les extraits originaux et adaptés fournis par Kevin'
            git push origin HEAD:codex/leadmagnet-real-example-20261104
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-leadmagnet-pair
          path: public/demo/leadmagnet-*-20261104.*
          retention-days: 1
