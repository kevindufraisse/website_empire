name: Apply reviewed home format refinements
on:
  push:
    branches: [codex/home-formats-team-copy-20261105]
    paths: [scripts/apply-home-formats-refinement.py, .github/workflows/apply-home-formats-refinement.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-formats-team-copy-20261105
      - run: |
          python3 scripts/apply-home-formats-refinement.py
          sed -i 's/[[:blank:]]*$//' components/sections/EmpireCommunitySection.tsx
      - run: git diff --check
      - name: Commit only the reviewed homepage source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/FormulaScrollStory.tsx components/HomeStoryRefinement.module.css components/LeadMagnetScene.tsx components/CloneAppStory.tsx components/sections/EmpireCommunitySection.tsx components/sections/CompactIntegrations.tsx scripts/check-leadmagnet-demo.mjs
          git commit -m 'Raccorder les sept formats au scroll et préciser application, live et revenus'
          git push origin HEAD:codex/home-formats-team-copy-20261105
