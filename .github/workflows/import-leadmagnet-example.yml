name: Import founder lead magnet preview
on:
  pull_request:
    paths:
      - 'scripts/import-leadmagnet-example.py'
      - '.github/workflows/import-leadmagnet-example.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/leadmagnet-instagram-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install media inspection tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Import published founder video
        run: python3 scripts/import-leadmagnet-example.py
      - name: Save only the preview assets on the feature branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/demo/kevin-leadmagnet-claude-20261023.mp4 public/demo/kevin-leadmagnet-claude-20261023.jpg public/demo/kevin-leadmagnet-claude-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ajouter un extrait local du Reel CLAUDE de Kevin pour vérification'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leadmagnet-source-review
          path: artifacts/leadmagnet-source/
          retention-days: 7
